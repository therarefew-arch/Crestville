<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#fbf3e3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Crestville">
  <title>Crestville</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" class="brand-crest" aria-hidden="true"><path d="M12 2 L20 5 V11 C20 16 16.5 20 12 22 C7.5 20 4 16 4 11 V5 Z" fill="#e88c7d" stroke="#5b4636" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 13 L11 9 L13 12 L14.5 10.5 L17 13" fill="none" stroke="#fffaf0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="map-name">Crestville</span>
      </div>
      <div class="pills">
        <span class="pill" title="Coins"><span class="coin"></span><b id="coins">0</b></span>
        <span class="pill" title="Sweet Berries"><span class="berry"></span><b id="berries">0</b></span>
        <span class="pill" title="Crests"><svg viewBox="0 0 24 24" class="mini-crest" aria-hidden="true"><path d="M12 2 L20 5 V11 C20 16 16.5 20 12 22 C7.5 20 4 16 4 11 V5 Z" fill="#f6d36b" stroke="#5b4636" stroke-width="2" stroke-linejoin="round"/></svg><b id="crests">0</b></span>
      </div>
    </header>

    <div class="world" id="world-wrap">
      <canvas id="world"></canvas>
      <div class="flash" id="flash"></div>
      <div class="dialog hidden" id="dialog"><div class="who" id="dialog-who"></div><div id="dialog-text"></div><div class="more">▼</div></div>
    </div>

    <div class="padbar">
      <div class="dpad" id="dpad">
        <button data-dir="up" aria-label="Up"><svg viewBox="0 0 24 24"><path d="M6 15 L12 8 L18 15 Z"/></svg></button>
        <button data-dir="left" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15 6 L8 12 L15 18 Z"/></svg></button>
        <span class="dpad-mid"></span>
        <button data-dir="right" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M9 6 L16 12 L9 18 Z"/></svg></button>
        <button data-dir="down" aria-label="Down"><svg viewBox="0 0 24 24"><path d="M6 9 L12 16 L18 9 Z"/></svg></button>
      </div>
      <div class="actions">
        <button class="btn round-btn" id="btn-team"><span class="ico" data-icon="team"></span>Team</button>
        <button class="a-btn" id="btn-a" aria-label="Talk or interact">A</button>
      </div>
    </div>

    <div class="battle hidden" id="battle">
      <div class="b-head">
        <div class="b-title" id="b-title"></div>
        <button class="btn small" id="b-speed">1×</button>
        <button class="btn small" id="b-skip">Skip</button>
      </div>
      <div class="lane" id="lane"><div class="vs" id="vs">VS</div></div>
      <div class="b-foot" id="b-foot"></div>
    </div>

    <div class="panel hidden" id="panel">
      <div class="panel-head"><h2 id="panel-title"></h2><button class="btn small" id="panel-close">Close</button></div>
      <div class="panel-body" id="panel-body"></div>
    </div>

    <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
    <div id="toasts"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/world.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
